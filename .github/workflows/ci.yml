name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test (Rust unit tests)
        run: cargo test

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  python-checks:
    name: Python checks (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --find-interpreter

      - name: Verify import
        run: python -c "import bpe_rs; print(bpe_rs.build_info())"

      - name: Run Python tests
        run: python tests/test_bindings.py

  package-validation:
    name: Package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --find-interpreter

      - name: Verify py.typed is included
        run: |
          pip install twine
          # Check that py.typed is in the built wheel
          python -c "
          import zipfile, os
          for f in os.listdir('dist'):
              if f.endswith('.whl'):
                  with zipfile.ZipFile(os.path.join('dist', f)) as z:
                      names = z.namelist()
                      has_py_typed = any('py.typed' in n for n in names)
                      assert has_py_typed, 'py.typed not found in wheel'
                      print(f'py.typed present in {f}')
          "

      - name: Twine check
        run: twine check dist/*