[package]
name = "bpe_rs"
version = "0.1.0"
edition = "2024"
description = "High-performance Byte Pair Encoding (BPE) tokenizer in Rust with Python bindings"
license = "MIT"
repository = "https://github.com/vvaibhavv11/bpe_rs"
readme = "README.md"
keywords = ["bpe", "tokenizer", "nlp", "machine-learning", "pyo3"]
categories = ["text-processing", "science"]

[lib]
name = "bpe_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["extension-module"] }
rayon = "1.10"
